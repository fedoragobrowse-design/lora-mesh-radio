[package]
name = "mesh-exerciser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mesh-exerciser"
path = "src/main.rs"

[dependencies]
mesh-core = { path = "../mesh-core" }
mesh-node = { path = "../mesh-node" }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
