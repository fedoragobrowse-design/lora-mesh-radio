[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshctl"
version = "0.1.0"
description = "USB terminal interface for three-node Pico LoRa mesh"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "zxing-cpp>=2.0", "Pillow>=10", "numpy>=1.24"]

[project.scripts]
meshctl = "meshctl.__main__:main"
meshchat = "meshctl.app:main"

[tool.setuptools]
packages = ["meshctl"]
package-dir = {"" = "."}
