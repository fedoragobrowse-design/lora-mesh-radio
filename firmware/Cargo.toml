[package]
name = "mesh-firmware"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Real SX1276 radio driver + relay/RX path. Off by default: the default
# image never initializes SPI GPIOs or the radio; every RF call returns
# RADIO_UNAVAILABLE. Enabled via `--features radio` for the radio-secure
# image only (upstream async ExclusiveDevice SPI ownership).
radio = ["dep:lora-phy", "embedded-hal-bus/async"]

[dependencies]
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-usb = "0.6.0"
embassy-futures = "0.1"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.2", optional = true }
heapless = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
sequential-storage = { version = "8.0.1", features = ["heapless"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
zeroize = { version = "1", default-features = false }
mesh-core = { path = "../crates/mesh-core" }
mesh-node = { path = "../crates/mesh-node" }
cortex-m-rt = "0.7"
panic-probe = "1"
lora-phy = { git = "https://github.com/lora-rs/lora-rs", rev = "8a7851f775596cd2b1c3075f6c02836cd3d7c6e8", optional = true }
